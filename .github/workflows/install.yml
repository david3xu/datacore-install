name: install

# A fresh install is the whole product here, and it is the thing most easily broken by a change
# that looks safe on a machine where Datacore is already installed. Every defect this repo has
# shipped — the version pointer swap, the empty agent ids, the EULA marker, the login agent's PATH
# — only reproduced on a box that had never seen Datacore. A GitHub-hosted runner is exactly that
# box, every time, so the install runs here rather than on somebody's laptop.
#
# Two jobs on purpose:
#   source     the repository as it stands, which is what a release will carry
#   published  the documented one-liner, which is what users run today
# They can disagree. install.sh is served from main and takes effect immediately; lib/*.sh ship as
# release assets and lag until a release is cut. `published` is what tells you that gap is open.

on:
  push:
    branches: [main]
    paths: ['install.sh', 'datacore', 'lib/**', '.github/workflows/install.yml']
  pull_request:
    paths: ['install.sh', 'datacore', 'lib/**', '.github/workflows/install.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    # Both architectures, because the release ships an archive for each and the installer picks by
    # platform. The arm64 archive had never been installed by anything before this job existed.
    name: install from this checkout (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The installer registers Datacore with the AI clients it finds, and verifies the connection
      # by reading the entry back. No runner has the real CLI, so stand in for it: the stub records
      # what it was asked to add and can answer `mcp get`, which is all the installer relies on.
      # It doubles as the thing that makes claude-code count as an installed worker CLI.
      - name: Stub the claude CLI
        run: |
          mkdir -p ~/bin ~/stub
          cat > ~/bin/claude <<'STUB'
          #!/bin/sh
          ENT="$HOME/stub/entry.txt"
          printf '%s\n' "$*" >> "$HOME/stub/claude-calls.log"
          case "$1 $2" in
            "mcp add")    shift 2; printf '%s\n' "$*" > "$ENT"; exit 0 ;;
            "mcp remove") rm -f "$ENT"; exit 0 ;;
            "mcp get")    [ -f "$ENT" ] || exit 1
                          cat "$ENT"
                          echo "To remove this server, run: claude mcp remove datacore -s user"
                          exit 0 ;;
          esac
          exit 1
          STUB
          chmod +x ~/bin/claude
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install
        env:
          DATACORE_ACCEPT_EULA: '1'
        run: ./install.sh

      # Everything below is an assertion, not a demonstration: the job has to fail when the
      # installer silently does the wrong thing, which is the failure mode that got us here.
      - name: The install is where it says it is
        run: |
          set -eu
          test -L ~/.datacore/current
          test -x ~/.datacore/bin/datacore
          test -f ~/.datacore/.eula-accepted
          grep -q "^DATACORE_HOME=$HOME/.datacore/data$" ~/.datacore/current/.env
          # The fixed path both this installer and the bundle's own generator used to default to.
          # Anything here means a second install on this machine would adopt the first one's data.
          test ! -e ~/.datacore-local/postgres || echo "::warning::the bundle still creates ~/.datacore-local"

      - name: Only the workers this machine can actually run are enabled
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, sys
          gen = os.path.expanduser('~/.datacore/current/generated')
          reg = json.load(open(f'{gen}/azure-worker-registry.json'))['workers']
          cat = json.load(open(f'{gen}/azure-worker-catalogue.json'))['workers']

          # An entry with no phases is an identity, not a dispatch target. The MCP operator is one,
          # and it carries cli:"claude-code" like any worker — deleting it would take the client's
          # MCP token with it, so assert it survived the prune.
          dispatch = sorted(w['agent_id'] for w in reg if w.get('phases'))
          identity = [w['agent_id'] for w in reg if not w.get('phases')]

          # Only `claude` is stubbed, so only the claude-code families are installable. agy is
          # excluded because the bundle's own catalogue flags it out of the default profile.
          assert dispatch == ['claude-review@opus', 'claude-worker@sonnet'], dispatch
          assert len(identity) == 1, identity

          # The catalogue holds every worker a token was actually minted for -- not every worker
          # that exists. `len(cat) >= 29` used to assert the opposite, because the old way to enable
          # an unprovisioned worker was DATACORE_LOCAL_FULL_WORKER_REGISTRY=1, which re-minted all
          # 29 catalogued identities to use one of them. lib/worker.sh now asks the Runtime for a
          # single credential on demand, so a stock install mints 5 and 29 pre-minted credentials
          # for workers nobody enabled is the thing that was fixed, not a thing to assert.
          #
          # What has to stay true is the relationship: nothing enabled may be missing from the
          # catalogue, or removing it would strand a worker whose token cannot be given back.
          cat_ids = {w['agent_id'] for w in cat}
          reg_ids = {w['agent_id'] for w in reg}
          missing = sorted(reg_ids - cat_ids)
          assert not missing, f'enabled but absent from the catalogue: {missing}'
          assert all('token' in w for w in cat), 'a catalogue entry lost its token'
          print(f'enabled {dispatch}, catalogue holds {len(cat)} minted worker(s)')
          PY

      # Enabled is not the same as reachable. The Coordinator dispatches from executor profiles,
      # and when none are generated it falls back to the example list baked into the image --
      # which silently works for the agent ids that list happens to name and fails for every
      # other one. Assert the profiles exist and cover exactly the workers that are enabled.
      - name: Every enabled worker has an executor profile
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, sys
          home = os.path.expanduser('~/.datacore')
          profiles_path = f'{home}/data/coordinator/executors.json'
          if not os.path.exists(profiles_path):
              sys.exit(f'no executor profiles at {profiles_path} — the Coordinator would fall back '
                       'to the example list in the image and enabled workers would be unreachable')
          profiles = json.load(open(profiles_path))
          reg = json.load(open(f'{home}/current/generated/azure-worker-registry.json'))['workers']
          enabled = sorted(w['agent_id'] for w in reg if w.get('phases'))
          targets = sorted(p['target_agent'] for p in profiles)
          assert enabled == targets, f'enabled={enabled} but profiles cover={targets}'
          # A task naming no target still has to land somewhere, on each side.
          impl = [p for p in profiles if p.get('is_default') and 'review' not in p['phases']]
          rev  = [p for p in profiles if p.get('is_default') and p['phases'] == ['review']]
          assert len(impl) == 1, f'expected one default implementation profile, got {impl}'
          assert len(rev) == 1, f'expected one default review profile, got {rev}'
          print(f'{len(profiles)} profile(s), covering exactly {targets}')
          PY

      - name: worker sync is idempotent
        run: |
          set -eu
          before=$(sha256sum ~/.datacore/data/coordinator/executors.json | cut -d' ' -f1)
          ~/.datacore/bin/datacore worker sync
          after=$(sha256sum ~/.datacore/data/coordinator/executors.json | cut -d' ' -f1)
          test "$before" = "$after" || { echo "sync rewrote an unchanged registry"; exit 1; }
          echo "sync left the profiles byte-identical"

      - name: Enabling a worker whose CLI is missing says so
        run: |
          set -eu
          # 2>&1 because the warning is on stderr and this has to fail if it stops being emitted.
          out=$(~/.datacore/bin/datacore worker add codex 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "not on PATH"
          printf '%s\n' "$out" | grep -q 'codex-worker@gpt-6-luna'

      - name: prune returns to the lean default, and counts the new CLI
        run: |
          set -eu
          printf '#!/bin/sh\necho codex 1.0\n' > ~/bin/codex && chmod +x ~/bin/codex
          ~/.datacore/bin/datacore worker prune
          python3 -c "
          import json, os
          reg = json.load(open(os.path.expanduser('~/.datacore/current/generated/azure-worker-registry.json')))['workers']
          got = sorted(w['agent_id'] for w in reg if w.get('phases'))
          want = ['claude-review@opus', 'claude-worker@sonnet', 'codex-review@gpt-6-luna', 'codex-worker@gpt-6-luna']
          assert got == want, (got, want)
          print('lean set:', got)"

      - name: One exact model can be added, and a family removed
        run: |
          set -eu
          ~/.datacore/bin/datacore worker add codex-review@gpt-6-astra
          ~/.datacore/bin/datacore worker remove codex-review
          python3 -c "
          import json, os
          reg = json.load(open(os.path.expanduser('~/.datacore/current/generated/azure-worker-registry.json')))['workers']
          got = sorted(w['agent_id'] for w in reg if w.get('phases'))
          assert got == ['claude-review@opus', 'claude-worker@sonnet', 'codex-worker@gpt-6-luna'], got
          print('after remove:', got)"
          # A removal must never destroy a token: the catalogue still has to be able to give it
          # back. This is the assertion the `len(cat) >= 29` check was standing in for, so it is
          # checked rather than merely exercised -- the add below used to be the last line of the
          # step, and a re-add that silently minted a *different* credential would have passed.
          python3 -c "
          import json, os
          cat = json.load(open(os.path.expanduser('~/.datacore/current/generated/azure-worker-catalogue.json')))['workers']
          before = {w['agent_id']: w['token'] for w in cat}
          json.dump(before, open('/tmp/tokens-before.json', 'w'))
          assert 'codex-review@gpt-6-astra' in before, sorted(before)
          print('token retained in the catalogue after removal')"
          ~/.datacore/bin/datacore worker add codex-review@gpt-6-astra
          python3 -c "
          import json, os
          before = json.load(open('/tmp/tokens-before.json'))
          reg = json.load(open(os.path.expanduser('~/.datacore/current/generated/azure-worker-registry.json')))['workers']
          now = {w['agent_id']: w.get('token') for w in reg}
          got, want = now.get('codex-review@gpt-6-astra'), before['codex-review@gpt-6-astra']
          assert got == want, 're-adding the worker minted a different credential'
          print('re-add returned the same credential')"

      - name: doctor reports nothing blocking
        run: |
          set -eu
          # A pipe into `tail` would hide doctor's exit code and make this step decorative, so
          # capture the report and judge it. A missing worker CLI is expected on a runner and is
          # not blocking; anything else is.
          ~/.datacore/bin/datacore doctor > doctor.log 2>&1 || true
          tail -3 doctor.log
          blocking=$(grep ' FAIL ' doctor.log | grep -v 'bridge_dispatch:launcher:' || true)
          if [ -n "$blocking" ]; then
            printf '%s\n' "$blocking"
            echo "::error::doctor reports a blocking failure"
            exit 1
          fi

      - name: The AI client was registered, and the connection was verified
        run: |
          set -eu
          test -f ~/stub/entry.txt
          # CI logs on a public repo are world-readable. The token is local-only and dies with the
          # runner, but it is still a credential, so it never reaches the log.
          sed 's/Bearer [A-Za-z0-9_-]*/Bearer <redacted>/g' ~/stub/entry.txt
          grep -q '127.0.0.1' ~/stub/entry.txt
          grep -q 'X-Datacore-MCP-Tool-Bundle' ~/stub/entry.txt

      - name: Uninstall leaves nothing running and no install tree
        run: |
          set -eu
          ~/.datacore/bin/datacore uninstall --yes
          test ! -e ~/.datacore/current
          test "$(docker ps -aq | wc -l)" = 0
          # The client entry has to go too: an entry pointing at a runtime that no longer exists
          # makes the AI client fail on every call with nothing to explain why.
          test ! -f ~/stub/entry.txt

  consistency:
    name: the pinned release is stated the same way everywhere
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # install.sh carries the release it was cut with, and the README tells users to fetch the
      # installer from that same tag. Nothing but this check keeps the two in step, and a drift
      # means the documented command installs a different version from the one it advertises.
      - name: install.sh and README agree on the version
        run: |
          set -eu
          pinned=$(sed -n 's/^PINNED_RELEASE="\(.*\)"$/\1/p' install.sh)
          test -n "$pinned" || { echo "install.sh has no PINNED_RELEASE"; exit 1; }
          echo "install.sh pins: $pinned"
          bad=0
          for url in $(grep -o 'datacore-install/[^/]*/install.sh' README.md | sort -u); do
            ref=$(printf '%s' "$url" | cut -d/ -f2)
            if [ "$ref" != "$pinned" ]; then
              echo "README fetches the installer from '$ref', but install.sh pins '$pinned'"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
          echo "README and install.sh both name $pinned"

      # A pinned tag that was never published is worse than no pin: the documented one-liner 404s.
      - name: the pinned release actually exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pinned=$(sed -n 's/^PINNED_RELEASE="\(.*\)"$/\1/p' install.sh)
          if gh release view "$pinned" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$pinned is published"
          else
            echo "::error::install.sh and README point at $pinned, which is not a published release — cut it before this lands on main"
            exit 1
          fi

      # A release can exist and still be unusable. One was published carrying only the amd64
      # bundle -- every Apple Silicon user 404s -- and with a SHA256SUMS listing hashes for
      # archives that were not the ones attached, because the assets were uploaded from a stale
      # build. The installer verifies the archive, so that fails loudly at install time; this
      # fails it at release time instead, which is where it can still be fixed.
      # A draft release is fully visible to its owner and invisible to everyone else, so every
      # check above can pass while the documented one-liner returns 404 for every user. The only
      # honest test is to fetch the documented URL the way a stranger would: unauthenticated.
      - name: the documented one-liner is actually reachable
        run: |
          set -eu
          pinned=$(sed -n 's/^PINNED_RELEASE="\(.*\)"$/\1/p' install.sh)
          url="https://raw.githubusercontent.com/${{ github.repository }}/$pinned/install.sh"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          echo "$url -> HTTP $code"
          if [ "$code" != 200 ]; then
            echo "::error::the install command in the README returns HTTP $code. The tag $pinned is not public — a draft release does not push its tag."
            exit 1
          fi

      - name: the pinned release is published, not a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pinned=$(sed -n 's/^PINNED_RELEASE="\(.*\)"$/\1/p' install.sh)
          draft=$(gh release view "$pinned" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)
          echo "$pinned isDraft=$draft"
          if [ "$draft" != false ]; then
            echo "::error::$pinned is a draft. Its assets and tag are invisible to users, so the documented install command cannot work."
            exit 1
          fi

      - name: the published release is complete and self-consistent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pinned=$(sed -n 's/^PINNED_RELEASE="\(.*\)"$/\1/p' install.sh)
          names=$(gh release view "$pinned" --repo "${{ github.repository }}" --json assets \
                    --jq '.assets[].name' | sort)
          echo "assets attached to $pinned:"; printf '%s\n' "$names" | sed 's/^/  /'
          # The CLI files are read out of install.sh's own CLI_FILES rather than listed here. A
          # hand-kept list drifts the moment a new helper is added: lib/project.sh and
          # lib/install-desktop-entry.py were both in CLI_FILES and absent from this list, so a
          # release without them passed -- and `datacore project`, which gates every dispatch,
          # would simply not exist on a real install.
          cli=$(sed -n 's/^CLI_FILES="\(.*\)"$/\1/p' install.sh | tr ' ' '\n' | sed 's|^lib/||')
          test -n "$cli" || { echo "::error::install.sh has no CLI_FILES"; exit 1; }
          # One name per line, compared with grep -qxF. A multi-line pattern is a *list* of
          # alternatives to grep, so a single `grep -qx "$cli"` passes as soon as any one entry
          # matches -- it reads like a check and tests almost nothing. -F keeps a filename's dot
          # from matching any character.
          missing=""
          printf 'datacore-local-edition-amd64.tar.gz\ndatacore-local-edition-arm64.tar.gz\nSHA256SUMS\n%s\n' \
            "$cli" > /tmp/want.txt
          while IFS= read -r want; do
            test -n "$want" || continue
            printf '%s\n' "$names" | grep -qxF "$want" || missing="$missing $want"
          done < /tmp/want.txt
          if [ -n "$missing" ]; then
            echo "::error::$pinned is missing:$missing"
            exit 1
          fi

          # Every asset the manifest names must hash to what the manifest claims. This is the
          # check that catches assets uploaded from a different build than the manifest.
          work=$(mktemp -d); cd "$work"
          gh release download "$pinned" --repo "${{ github.repository }}" --clobber
          if sha256sum -c SHA256SUMS; then
            echo "every published asset matches the published SHA256SUMS"
          else
            echo "::error::$pinned has assets that do not match its own SHA256SUMS — they were uploaded from a different build"
            exit 1
          fi

          # `sha256sum -c` only vouches for the files the manifest names. install.sh deletes any
          # CLI helper the manifest omits (rightly -- it will not put an unverified file on PATH),
          # so an attached-but-unlisted helper is as absent as a missing one, and only warns.
          unlisted=""
          while IFS= read -r want; do
            test -n "$want" || continue
            case "$want" in SHA256SUMS) continue ;; esac
            grep -q " $want\$" SHA256SUMS || unlisted="$unlisted $want"
          done < /tmp/want.txt
          if [ -n "$unlisted" ]; then
            echo "::error::$pinned ships these without a SHA256SUMS entry, so install.sh will refuse them:$unlisted"
            exit 1
          fi
          echo "SHA256SUMS accounts for every file install.sh installs"

  published:
    name: install from the published one-liner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stub the claude CLI
        run: |
          mkdir -p ~/bin ~/stub
          cat > ~/bin/claude <<'STUB'
          #!/bin/sh
          ENT="$HOME/stub/entry.txt"
          case "$1 $2" in
            "mcp add")    shift 2; printf '%s\n' "$*" > "$ENT"; exit 0 ;;
            "mcp remove") rm -f "$ENT"; exit 0 ;;
            "mcp get")    [ -f "$ENT" ] || exit 1
                          cat "$ENT"
                          echo "To remove this server, run: claude mcp remove datacore -s user"
                          exit 0 ;;
          esac
          exit 1
          STUB
          chmod +x ~/bin/claude
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Run the command the README actually prints, rather than a copy of it kept in this file.
      # A copy drifts, and then CI proves an install path no user was ever told to take.
      - name: Install the way the README says to
        env:
          DATACORE_ACCEPT_EULA: '1'
        run: |
          set -eu
          cmd=$(grep -m1 '^curl -fsSL .*install.sh | sh$' README.md)
          test -n "$cmd" || { echo "no one-liner found in README.md"; exit 1; }
          echo "running the README's own command:"
          echo "  $cmd"
          sh -c "$cmd"

      - name: It runs, and it registered a client
        run: |
          set -eu
          test -f ~/stub/entry.txt
          ~/.datacore/bin/datacore doctor > doctor.log 2>&1 || true
          tail -3 doctor.log
          blocking=$(grep ' FAIL ' doctor.log | grep -v 'bridge_dispatch:launcher:' || true)
          [ -z "$blocking" ] || { printf '%s\n' "$blocking"; exit 1; }

      # install.sh comes from main; lib/*.sh come from the latest release. So this job can be
      # running new installer logic against an old helper, and the worker trim is the part that
      # degrades. Report the gap instead of failing: the fix is cutting a release, not reverting.
      - name: Report whether the released helper can trim the registry
        run: |
          set -eu
          n=$(python3 -c "
          import json, os
          reg = json.load(open(os.path.expanduser('~/.datacore/current/generated/azure-worker-registry.json')))['workers']
          print(sum(1 for w in reg if w.get('phases')))")
          echo "dispatchable workers after install: $n"
          if [ "$n" -gt 4 ]; then
            echo "::warning::the released lib/worker.sh cannot trim the registry ($n workers enabled) — cut a release carrying the current lib/worker.sh"
          fi

      # The released lib/uninstall.sh was never run by any job. The checkout job tests the copy in
      # this repo, so a released helper could be -- and was -- broken while CI stayed green: a
      # trailing `[ ... ] && info` made the uninstall abort after disconnecting the client and
      # before removing the images, the data or the install tree, exiting 1 on every Linux machine.
      # This runs the helper a user actually gets. It fails rather than warns, unlike the worker
      # trim above, because the failure mode is not graceful degradation: it is a half-removed
      # install that reports failure for work it completed.
      - name: The released uninstaller removes the install, and says so
        run: |
          set -eu
          ~/.datacore/bin/datacore uninstall --yes || {
            echo "::error::the released lib/uninstall.sh exited non-zero — re-upload it to the release"
            exit 1
          }
          for leftover in ~/.datacore/current ~/stub/entry.txt; do
            if [ -e "$leftover" ]; then
              echo "::error::the released uninstaller left $leftover behind"
              exit 1
            fi
          done
          test "$(docker ps -aq | wc -l)" = 0 || {
            echo "::error::the released uninstaller left containers running"
            docker ps -a
            exit 1
          }
          echo "the released uninstaller removed the install tree, the client entry and the containers"

  desktop-entry:
    name: the Claude Desktop remover keeps its contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # This is the only script that rewrites a file the user owns -- their Claude Desktop config,
      # which holds every other MCP server they have. It had no automated coverage, and its
      # failure modes are silent: a half-written file, or an entry claimed from another install.
      # The Desktop path is macOS-gated so the install jobs never reach it, but the script itself
      # is plain Python and runs anywhere.
      - name: Exercise every exit path
        run: |
          set -eu
          S=lib/uninstall-desktop-entry.py
          T=$(mktemp -d)
          fail() { echo "::error::$1"; exit 1; }
          try() { set +e; python3 -I "$S" "$1" "$2" >"$T/out" 2>&1; printf '%s' "$?"; set -e; }
          try3() { set +e; python3 -I "$S" "$1" "$2" "$3" >"$T/out" 2>&1; printf '%s' "$?"; set -e; }

          # Ours: the entry goes, everything else in the user's config stays.
          printf '%s' '{"mcpServers":{"other":{"command":"x"},"datacore":{"args":["http://127.0.0.1:43123/mcp"]}},"theme":"dark"}' > "$T/a.json"
          [ "$(try "$T/a.json" 43123)" = 0 ] || fail "removing our own entry did not exit 0"
          python3 -I -c "
          import json,sys
          c=json.load(open('$T/a.json'))
          assert 'datacore' not in c['mcpServers'], 'our entry was not removed'
          assert 'other' in c['mcpServers'], 'another MCP server was destroyed'
          assert c.get('theme')=='dark', 'unrelated config was lost'"

          # Another install's entry: 3123 must not match 43123.
          printf '%s' '{"mcpServers":{"datacore":{"args":["http://127.0.0.1:43123/mcp"]}}}' > "$T/b.json"
          [ "$(try "$T/b.json" 3123)" = 1 ] || fail "port 3123 claimed the entry belonging to 43123"
          grep -q datacore "$T/b.json" || fail "another install's entry was deleted"

          # No entry of ours at all.
          printf '%s' '{"mcpServers":{"other":{}}}' > "$T/c.json"
          [ "$(try "$T/c.json" 43123)" = 1 ] || fail "a config without our entry should exit 1"

          # Malformed config: a clean error, the file untouched, and no traceback for the user.
          printf '%s' '{"mcpServers": {oops' > "$T/d.json"
          [ "$(try "$T/d.json" 43123)" = 3 ] || fail "a malformed config should exit 3"
          grep -qi traceback "$T/out" && fail "a traceback reached the user" || true
          [ "$(cat "$T/d.json")" = '{"mcpServers": {oops' ] || fail "a malformed config was modified"

          [ "$(try "$T/absent.json" 43123)" = 3 ] || fail "a missing file should exit 3"

          # An unwritable directory must leave the original intact and drop no temp file: the
          # earlier version truncated the config first, so a failure here lost the whole file.
          printf '%s' '{"mcpServers":{"datacore":{"args":["127.0.0.1:43123"]},"keep":{"command":"y"}}}' > "$T/e.json"
          cp "$T/e.json" "$T/e.expected"; chmod 500 "$T"
          st=$(try "$T/e.json" 43123); chmod 700 "$T"
          [ "$st" = 3 ] || fail "an unwritable directory should exit 3 (got $st)"
          cmp -s "$T/e.json" "$T/e.expected" || fail "the config was damaged by a failed rewrite"
          # Test for emptiness rather than counting: `wc -l` pads its output on some platforms,
          # which made this check fail on a directory that was in fact clean.
          [ -z "$(find "$T" -name '.datacore-mcp-*')" ] || fail "a temp file was left behind"

          set +e; python3 -I "$S" >/dev/null 2>&1; u=$?; set -e
          [ "$u" = 2 ] || fail "wrong usage should exit 2"

          # The entry this installer writes is {"command": "<root>/support/..."} with no port in
          # it, so a port-only ownership test could never recognise our own entry: the installer
          # added something the uninstaller then refused to remove.
          printf '%s' '{"mcpServers":{"datacore":{"command":"/opt/dc/current/support/x.sh"},"keep":{}}}' > "$T/g.json"
          [ "$(try3 "$T/g.json" 43123 /opt/dc)" = 0 ] || fail "a command-style entry in our own root was not recognised"
          grep -q keep "$T/g.json" || fail "another MCP server was destroyed"
          printf '%s' '{"mcpServers":{"datacore":{"command":"/opt/dc/current/support/x.sh"}}}' > "$T/h.json"
          [ "$(try3 "$T/h.json" 43123 /opt/other)" = 1 ] || fail "an entry under another root was claimed"
          echo "ownership holds for both shapes: a port, and a path inside the install root"
          echo "every exit path holds: 0 removed, 1 not ours, 2 usage, 3 unreadable/unwritable"

      # The bundle's writer exits 0 having written a snippet inside the bundle and never merges
      # it, so registration always failed and the installer could only say so. The merger is the
      # only other thing here that rewrites a file the user owns.
      - name: The Claude Desktop merger keeps its contract
        run: |
          set -eu
          M=lib/install-desktop-entry.py
          T=$(mktemp -d)
          fail() { echo "::error::$1"; exit 1; }
          try() { set +e; python3 -I "$M" "$1" "$2" >"$T/out" 2>&1; printf '%s' "$?"; set -e; }

          printf '%s' '{"mcpServers":{"datacore":{"command":"/opt/dc/current/support/x.sh"}}}' > "$T/snip.json"

          printf '%s' '{"mcpServers":{"other":{"command":"y"}},"theme":"dark"}' > "$T/a.json"
          [ "$(try "$T/a.json" "$T/snip.json")" = 0 ] || fail "merging into an existing config did not exit 0"
          python3 -I -c "
          import json; c=json.load(open('$T/a.json'))
          assert c['mcpServers']['datacore']['command'] == '/opt/dc/current/support/x.sh', 'our entry is missing'
          assert 'other' in c['mcpServers'], 'another MCP server was lost'
          assert c['theme'] == 'dark', 'unrelated configuration was lost'"

          # A stale entry must be replaced, not merged: half of an older install's wiring left
          # behind is worse than either version on its own.
          printf '%s' '{"mcpServers":{"datacore":{"command":"/old","env":{"STALE":"1"}}}}' > "$T/b.json"
          [ "$(try "$T/b.json" "$T/snip.json")" = 0 ] || fail "replacing a stale entry did not exit 0"
          python3 -I -c "
          import json; e=json.load(open('$T/b.json'))['mcpServers']['datacore']
          assert 'env' not in e, 'stale wiring survived the replace'"

          [ "$(try "$T/absent.json" "$T/snip.json")" = 0 ] || fail "a config that does not exist yet should be created"
          grep -q datacore "$T/absent.json" || fail "the created config lacks the entry"

          printf '%s' '{"mcpServers":{}}' > "$T/empty.json"
          [ "$(try "$T/empty.json" "$T/empty.json")" = 1 ] || fail "a snippet naming no server should exit 1"
          [ "$(try "$T/empty.json" "$T/missing.json")" = 3 ] || fail "an unreadable snippet should exit 3"

          # A failed rewrite must leave the user's config exactly as it was.
          printf '%s' '{"mcpServers":{"keep":{"command":"k"}}}' > "$T/f.json"
          cp "$T/f.json" "$T/f.expected"; chmod 500 "$T"
          st=$(try "$T/f.json" "$T/snip.json"); chmod 700 "$T"
          [ "$st" = 3 ] || fail "an unwritable directory should exit 3 (got $st)"
          cmp -s "$T/f.json" "$T/f.expected" || fail "a failed merge damaged the config"
          [ -z "$(find "$T" -name '.datacore-mcp-*')" ] || fail "a temp file was left behind"

          set +e; python3 -I "$M" >/dev/null 2>&1; u=$?; set -e
          [ "$u" = 2 ] || fail "wrong usage should exit 2"
          echo "merger holds: 0 merged, 1 nothing named, 2 usage, 3 unreadable/unwritable"

  runtime-ownership:
    name: a healthy port is not accepted as proof of our runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The install used to take "/health says ok" as proof the runtime on its port was its own.
      # On a machine with more than one container-runtime VM forwarding ports to the host, that
      # is false, and the whole install completes before the lie surfaces -- as three token
      # failures telling the user to re-mint tokens that were never wrong. The guard is a few
      # lines of shell with four outcomes, and none of the install jobs can reach it, because
      # reaching it needs a second runtime on the same port. So drive it directly, against a
      # stub that plays the part of each kind of runtime.
      - name: Exercise every outcome against a stub runtime
        run: |
          set -eu
          T=$(mktemp -d)
          fail() { echo "::error::$1"; exit 1; }

          cat > "$T/stub.py" <<'PY'
          import http.server, json
          GOOD = "Bearer dc_stub_deadbeef"
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if not self.path.startswith("/api/v1/auth/resolve"):
                      body, code = b'{"status":"ok"}', 200
                  elif self.headers.get("Authorization") == GOOD:
                      # The spacing here is deliberate: the guard must read the id, not
                      # substring-match the body it happens to be wrapped in.
                      body = json.dumps({"authenticated_agent_id": "stub-bridge"},
                                        separators=(", ", ": ")).encode()
                      code = 200
                  else:
                      body, code = b'{"error":{"message":"Unauthorized."}}', 401
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers(); self.wfile.write(body)
              def log_message(self, *a): pass
          http.server.HTTPServer(("127.0.0.1", 44321), H).serve_forever()
          PY
          python3 -I "$T/stub.py" & stub=$!
          trap 'kill $stub 2>/dev/null || true' EXIT
          for _ in $(seq 20); do
            curl -fsS -m 1 http://127.0.0.1:44321/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS -m 2 http://127.0.0.1:44321/health >/dev/null || fail "the stub never came up"

          # Drive the shipped functions, not a copy of them.
          cat > "$T/harness.sh" <<'EOS'
          set -eu
          B=''; D=''; R=''
          ok()   { printf 'OK %s\n' "$*"; }
          info() { printf 'SKIP %s\n' "$*"; }
          # Print every argument, not just the first: the remediation lines are the part
          # under test.
          die()  { printf 'REFUSED %s\n' "$1" >&2; shift
                   while [ $# -gt 0 ]; do printf '%s\n' "$1" >&2; shift; done; exit 1; }
          BIN_DIR=/nonexistent/bin
          RUNTIME_URL=http://127.0.0.1:44321
          for f in container_host_desc port_owner runtime_port_diagnosis assert_runtime_is_ours; do
            eval "$(awk -v fn="^$f\\\\(\\\\)" '$0 ~ fn, /^}$/' "$2")"
          done
          cd "$1"
          assert_runtime_is_ours 44321
          EOS

          env_for() { printf 'DATACORE_WORKER_BRIDGE_AGENT_ID=%s\nDATACORE_RUNTIME_BEARER_TOKEN=%s\nDATACORE_HTTP_PORT=44321\n' "$1" "$2" > "$T/.env"; }
          run() { set +e; TMPDIR="$T" sh "$T/harness.sh" "$T" "$GITHUB_WORKSPACE/install.sh" >"$T/out" 2>&1; printf '%s' "$?"; set -e; }

          # Our own runtime: the token resolves to the agent id this install wrote.
          env_for stub-bridge dc_stub_deadbeef
          [ "$(run)" = 0 ] || fail "our own runtime was refused: $(cat "$T/out")"
          grep -q "resolved as stub-bridge" "$T/out" || fail "the accepted case did not say which identity resolved"

          # A runtime that refuses our identity. The refusal must offer BOTH causes: a stranger
          # on the port, and our own runtime whose database never saw this token. Claiming only
          # the first sends the user to free a port that was already theirs.
          env_for stub-bridge dc_stub_not_minted_here
          [ "$(run)" = 1 ] || fail "a runtime that rejects our token was accepted"
          grep -q "does not accept this install's identity" "$T/out" || fail "the refusal did not name the cause"
          grep -q "another Datacore owns port" "$T/out" || fail "the refusal dropped the foreign-runtime cause"
          grep -q "never saw this token" "$T/out" || fail "the refusal dropped the wrong-identity cause"
          grep -q "DATACORE_HTTP_PORT" "$T/out" || fail "the refusal did not offer the port fix"

          # A key repeated in .env must not become a two-line value that can never match.
          printf 'DATACORE_WORKER_BRIDGE_AGENT_ID=stub-bridge\nDATACORE_WORKER_BRIDGE_AGENT_ID=stale-one\nDATACORE_RUNTIME_BEARER_TOKEN=dc_stub_deadbeef\nDATACORE_RUNTIME_BEARER_TOKEN=dc_stub_stale\nDATACORE_HTTP_PORT=44321\n' > "$T/.env"
          [ "$(run)" = 0 ] || fail "a duplicated .env key broke the identity check: $(cat "$T/out")"

          # Half an identity is a broken install, not an install without one. Skipping the check
          # here is how a stranger's runtime gets reported as ours.
          printf 'DATACORE_RUNTIME_BEARER_TOKEN=dc_stub_deadbeef\nDATACORE_HTTP_PORT=44321\n' > "$T/.env"
          [ "$(run)" = 1 ] || fail "a token with no agent id was treated as nothing to check"
          grep -q "identity is incomplete" "$T/out" || fail "an incomplete identity was not named"
          printf 'DATACORE_WORKER_BRIDGE_AGENT_ID=stub-bridge\nDATACORE_HTTP_PORT=44321\n' > "$T/.env"
          [ "$(run)" = 1 ] || fail "an agent id with no token was treated as nothing to check"

          # No credential may survive the call, on any path.
          [ -z "$(find "$T" -name 'datacore-authcheck.*')" ] || fail "a token file was left behind"

          # A runtime that trusts the token but is serving some other install's identity.
          env_for someone-else dc_stub_deadbeef
          [ "$(run)" = 1 ] || fail "a runtime answering for another agent was accepted"
          grep -q "belongs to a different install" "$T/out" || fail "the mismatch was not named"

          # Nothing to check against: say so, do not claim the runtime was verified.
          printf 'DATACORE_HTTP_PORT=44321\n' > "$T/.env"
          [ "$(run)" = 0 ] || fail "a missing identity should not stop the install"
          grep -q "not verified" "$T/out" || fail "an unverified runtime was reported as verified"

          # A bearer token on a command line is readable by any process on the machine via ps.
          # curl can always take it from a config file, so for curl this is absolute. The single
          # exception is `claude mcp add`, which accepts the header only as an argument -- pin it
          # at one occurrence so a new one cannot slip in beside it.
          [ "$(grep -c -- '-H "Authorization: Bearer' install.sh)" = 0 ] \
            || fail "a bearer token is passed to curl in argv"
          [ "$(grep -c -- '--header "Authorization: Bearer' install.sh)" = 1 ] \
            || fail "the number of tokens passed in argv changed; argv is world-readable"
          grep -q 'curl .*-K "\$_cfg"' install.sh || fail "the auth probe stopped using a curl config file"
          grep -q 'mktemp "\${TMPDIR:-/tmp}/datacore-authcheck' install.sh \
            || fail "the credential file stopped being created with mktemp"

          echo "all four outcomes hold: ours accepted, stranger refused, wrong identity refused, unknown reported as unknown"

  project-map:
    name: a project map that cannot silently stop dispatch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # `datacore project` exists because an install could pass doctor with 21 ok and still fail
      # every dispatch: the bridge resolves a workspace by exact project name, the installer left
      # {"default":"$HOME"} there to satisfy a pre-flight that rejects an empty map, and no command
      # existed to put anything true in its place. These checks hold the parts of that contract a
      # regression would be silent about.
      - name: The project map keeps its contract
        run: |
          set -eu
          T=$(mktemp -d)
          R="$T/root"; mkdir -p "$R/current"
          E="$R/current/.env"
          KEY=DATACORE_WORKER_PROJECT_WORKSPACES
          fail() { echo "::error::$1"; exit 1; }
          dcp() { set +e; DATACORE_INSTALL_ROOT="$R" HOME="$T/home" sh lib/project.sh "$@" >"$T/out" 2>&1; _s=$?; set -e; printf '%s' "$_s"; }
          mkdir -p "$T/home"
          val() { grep "^$KEY=" "$E" | sed "s/^[^=]*=//; s/^'//; s/'\$//"; }

          # A repository to map to, and one the user never created.
          mkdir -p "$T/repo/.git"

          # --- the reserved stand-in is not presented as a usable mapping -------------------
          printf "A=1\n%s='{\"_unconfigured\":\"%s\"}'\nB=2\n" "$KEY" "$R/workspaces/_unconfigured" > "$E"
          [ "$(dcp list)" = 0 ] || { cat "$T/out"; fail "list over a stand-in should exit 0"; }
          grep -q "No project is mapped" "$T/out" || { cat "$T/out"; fail "a stand-in was reported as a mapping"; }

          # --- the legacy {"default":"$HOME"} is called out, not inherited quietly ----------
          printf "%s='{\"default\":\"%s\"}'\n" "$KEY" "$T/home" > "$E"
          [ "$(dcp list)" = 0 ] || { cat "$T/out"; fail "list over the legacy stand-in should exit 0"; }
          grep -q "No project is mapped" "$T/out" || fail "the legacy stand-in was counted as a mapping"
          grep -q "whole home directory" "$T/out" || { cat "$T/out"; fail "the legacy stand-in was not called out"; }

          # A project a user deliberately named "default" is theirs, and is NOT a stand-in.
          printf "%s='{\"default\":\"%s\"}'\n" "$KEY" "$T/repo" > "$E"
          [ "$(dcp list)" = 0 ] || fail "list should exit 0"
          grep -q "No project is mapped" "$T/out" && fail "a real project named default was discarded"

          # --- link collapses duplicate copies and clears every stand-in -------------------
          printf "%s='{\"default\":\"%s\"}'\nX=1\n%s='{\"_unconfigured\":\"/tmp/x\"}'\n" "$KEY" "$T/home" "$KEY" > "$E"
          [ "$(dcp link my-proj "$T/repo")" = 0 ] || { cat "$T/out"; fail "link should exit 0"; }
          [ "$(grep -c "^$KEY=" "$E")" = 1 ] || fail "duplicate copies of the key survived the write"
          printf '%s' "$(val)" | grep -q '"my-proj"' || { val; fail "the mapping was not written"; }
          printf '%s' "$(val)" | grep -q '_unconfigured' && fail "the reserved stand-in survived a real mapping"
          printf '%s' "$(val)" | grep -q '"default"' && fail "the legacy stand-in survived a real mapping"
          grep -q "^X=1$" "$E" || fail "an unrelated .env line was lost"

          # --- the path is stored absolute, because the bridge resolves it from its own cwd --
          cd "$T/repo" && rel_status=$(DATACORE_INSTALL_ROOT="$R" HOME="$T/home" sh "$GITHUB_WORKSPACE/lib/project.sh" link rel-proj . >/dev/null 2>&1; echo $?) ; cd "$GITHUB_WORKSPACE"
          [ "$rel_status" = 0 ] || fail "linking a relative path should resolve it, not fail"
          printf '%s' "$(val)" | grep -q "\"$T/repo\"" || { val; fail "a relative path was not resolved to an absolute one"; }

          # --- refusals -------------------------------------------------------------------
          [ "$(dcp link nope "$T/does-not-exist")" = 1 ] || fail "linking a missing directory should fail"
          # A name lands in the same single-quoted .env value as a path, so it breaks it the same
          # way. Guarding only the path is the bug this case exists to catch.
          [ "$(dcp link "quote'd" "$T/repo")" = 1 ] || fail "a project name with a single quote must be refused"
          grep -q "single quote" "$T/out" || { cat "$T/out"; fail "the name refusal did not say why"; }
          mkdir -p "$T/has'quote"
          [ "$(dcp link q2 "$T/has'quote")" = 1 ] || fail "a path with a single quote must be refused, not written broken"
          grep -q "single quote" "$T/out" || { cat "$T/out"; fail "the refusal did not say why"; }

          # --- unlink reports once, and never leaves an empty map -------------------------
          [ "$(dcp unlink no-such)" = 1 ] || fail "unlinking an unmapped project should fail"
          [ "$(grep -c 'no-such' "$T/out")" = 1 ] || { cat "$T/out"; fail "the same refusal was printed twice"; }

          printf "%s='{\"only\":\"%s\"}'\n" "$KEY" "$T/repo" > "$E"
          [ "$(dcp unlink only)" = 0 ] || { cat "$T/out"; fail "unlinking the last project should exit 0"; }
          printf '%s' "$(val)" | grep -q '_unconfigured' || { val; fail "the last unlink left a map the pre-flight rejects"; }
          [ "$(printf '%s' "$(val)" | tr -d ' ')" != '{}' ] || fail "the map was left empty"

          # --- a malformed value is reported, not silently replaced -----------------------
          printf "%s='{not json'\n" "$KEY" > "$E"
          [ "$(dcp list)" = 1 ] || fail "list over malformed JSON should fail"
          grep -q "not valid JSON" "$T/out" || { cat "$T/out"; fail "a malformed map was not reported as such"; }

          # --- the file stays private, and nothing is left in the temp directory ----------
          printf "%s='{\"p\":\"%s\"}'\n" "$KEY" "$T/repo" > "$E"
          [ "$(dcp link p2 "$T/repo")" = 0 ] || fail "link should exit 0"
          [ "$(stat -c '%a' "$E")" = 600 ] || fail ".env is no longer private (got $(stat -c '%a' "$E"))"
          [ -z "$(find "${TMPDIR:-/tmp}" -maxdepth 1 -name 'datacore-project*' 2>/dev/null)" ] || fail "a temp directory was left behind"
          [ -z "$(find "$(dirname "$E")" -name '*.dc-project.tmp')" ] || fail "a temp .env was left behind"

          echo "project map holds: stand-ins cleared, duplicates collapsed, never empty, paths absolute"

      # The installer has to classify what it finds in .env without bun, and the arms that decide
      # "this is a stand-in" vs "this is the user's own mapping" are the whole safety of the rewrite.
      - name: The installer tells a stand-in from a real mapping
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          # Lifted verbatim from install.sh's prepare_env so the test cannot drift from the code.
          grep -q "\*'\"'\"\$_ws_placeholder_key\"'\"'\*)" install.sh \
            || fail "install.sh no longer carries the reserved-key arm this test mirrors"
          cat > /tmp/classify.sh <<'EOF'
          #!/bin/sh
          _ws_placeholder_key=_unconfigured
          case "$1" in
            ''|'{}') echo standin-empty ;;
            *'"'"$_ws_placeholder_key"'"'*) echo standin-reserved ;;
            *'"default":"'"$HOME"'"'*) echo standin-legacy ;;
            *) echo real ;;
          esac
          EOF
          c() { HOME=/home/u sh /tmp/classify.sh "$1"; }
          [ "$(c '')" = standin-empty ]                             || fail "empty value misread"
          [ "$(c '{}')" = standin-empty ]                           || fail "empty object misread"
          [ "$(c '{"_unconfigured":"/x"}')" = standin-reserved ]     || fail "reserved stand-in misread"
          [ "$(c '{"default":"/home/u"}')" = standin-legacy ]        || fail "legacy stand-in misread"
          [ "$(c '{"my-proj":"/repo"}')" = real ]                    || fail "a real mapping was treated as a stand-in"
          [ "$(c '{"default":"/other"}')" = real ]                   || fail "a project named default was discarded"
          echo "classification holds: a real mapping is never mistaken for a stand-in"

      # The installer's own rewrite, run against .env fixtures. The block is extracted from
      # install.sh between its markers, so this exercises the shipped code rather than a copy that
      # can drift away from it.
      - name: The installer rewrites the map without damaging it
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          T=$(mktemp -d); mkdir -p "$T/home"
          python3 - <<'PY' > "$T/block.sh"
          import pathlib, re
          s = pathlib.Path("install.sh").read_text()
          m = re.search(r'# >>> worker-project-map.*?\n(.*?)  # <<< worker-project-map\n', s, re.S)
          assert m, "install.sh no longer carries the worker-project-map markers"
          print("INSTALL_ROOT=${INSTALL_ROOT:?}")
          print("die() { echo \"die: $*\" >&2; exit 9; }")
          print("info() { printf 'info: %s\\n' \"$1\"; }")
          print(m.group(1))
          print('printf "MAPPED=%s\\n" "$PROJECTS_MAPPED"')
          PY

          run() { ( cd "$T/env" && INSTALL_ROOT="$T/root" HOME="$T/home" sh "$T/block.sh" ); }
          val() { grep "^DATACORE_WORKER_PROJECT_WORKSPACES=" "$T/env/.env" | sed "s/^[^=]*=//; s/^'//; s/'\$//"; }
          setup() { rm -rf "$T/env" "$T/root"; mkdir -p "$T/env"; printf '%s' "$1" > "$T/env/.env"; }

          # --- a path with a space survives. Deleting it silently repointed a real mapping at a
          #     directory that does not exist, which is the worst outcome of the three.
          setup 'A=1
          DATACORE_WORKER_PROJECT_WORKSPACES='"'"'{"p":"/Users/me/My Repo"}'"'"'
          B=2'
          out=$(run) || fail "the rewrite failed on a path containing a space"
          printf '%s' "$(val)" | grep -q '"/Users/me/My Repo"' || { val; fail "a space inside the path was eaten"; }
          printf '%s' "$out" | grep -q 'MAPPED=1' || fail "a real mapping was not reported as mapped"

          # --- duplicate copies collapse to one, keeping the real mapping over the stand-ins
          setup 'DATACORE_WORKER_PROJECT_WORKSPACES='"'"'{"_unconfigured":"/x"}'"'"'
          KEEP=yes
          DATACORE_WORKER_PROJECT_WORKSPACES='"'"'{"real":"/srv/repo"}'"'"''
          out=$(run) || fail "the rewrite failed over duplicate copies"
          [ "$(grep -c '^DATACORE_WORKER_PROJECT_WORKSPACES=' "$T/env/.env")" = 1 ] || fail "duplicates survived"
          printf '%s' "$(val)" | grep -q '"real"' || { val; fail "the real mapping was not the one kept"; }
          grep -q '^KEEP=yes$' "$T/env/.env" || fail "an unrelated line was lost"
          printf '%s' "$out" | grep -q 'collapsed 2 copies' || fail "the collapse was not reported"

          # --- the legacy stand-in is replaced, and never with $HOME
          setup "DATACORE_WORKER_PROJECT_WORKSPACES='{\"default\":\"$T/home\"}'"
          out=$(run) || fail "the rewrite failed over the legacy stand-in"
          printf '%s' "$(val)" | grep -q '_unconfigured' || { val; fail "the legacy stand-in was kept"; }
          printf '%s' "$(val)" | grep -q "\"$T/home\"" && fail "the rewrite still points a worker at \$HOME"
          printf '%s' "$out" | grep -q 'MAPPED=0' || fail "a stand-in was reported as mapped"
          test -d "$T/root/workspaces/_unconfigured" || fail "the stand-in directory was not created"

          # --- a file with no copy of the key gets exactly one appended
          setup 'ONLY=1'
          run >/dev/null || fail "the rewrite failed on a file without the key"
          [ "$(grep -c '^DATACORE_WORKER_PROJECT_WORKSPACES=' "$T/env/.env")" = 1 ] || fail "the key was not appended once"

          # --- a double-quoted value is understood, not treated as a stand-in
          setup 'DATACORE_WORKER_PROJECT_WORKSPACES="{\"q\":\"/srv/q\"}"'
          out=$(run) || fail "the rewrite failed on a double-quoted value"
          printf '%s' "$out" | grep -q 'MAPPED=1' || { val; fail "a double-quoted real mapping was discarded"; }

          echo "installer rewrite holds: spaces kept, duplicates collapsed, \$HOME never written"

  release-assembly:
    name: a release cannot ship without the files install.sh needs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # v0.1.79 was assembled by hand and shipped 7 of the 9 files it needed: lib/project.sh and
      # lib/install-desktop-entry.py were in CLI_FILES and in neither the assets nor SHA256SUMS.
      # install.sh deletes any helper the manifest does not list, so `datacore project` -- the
      # command the install summary names as the first next step -- did not exist, with only a
      # warning line to say so. make-release.sh derives the asset set from CLI_FILES instead;
      # these checks hold it to that.
      - name: The assembled release carries every file install.sh installs
        run: |
          set -eu
          T=$(mktemp -d)
          pinned=$(sed -n 's/^PINNED_RELEASE="\(.*\)"$/\1/p' install.sh)
          mkdir -p "$T/bundle"
          for arch in amd64 arm64; do
            echo "not a real bundle" > "$T/bundle/datacore-local-edition-$arch.tar.gz"
          done

          sh make-release.sh "$pinned" "$T/bundle" > "$T/out" 2>&1 \
            || { cat "$T/out"; echo "::error::make-release.sh failed on a complete bundle dir"; exit 1; }

          out="dist/$pinned"
          test -f "$out/SHA256SUMS" || { echo "::error::no manifest was written"; exit 1; }

          # Every name in CLI_FILES, flattened the way install.sh fetches it, must be staged AND
          # listed. Deriving the list here from the same place the script does would let a broken
          # sed pass both sides, so read CLI_FILES independently.
          fail=0
          for f in $(sed -n 's/^CLI_FILES="\(.*\)"$/\1/p' install.sh); do
            n=$(basename "$f")
            test -f "$out/$n" || { echo "::error::$n was not staged"; fail=1; }
            grep -q "  $n\$" "$out/SHA256SUMS" || { echo "::error::$n is not in SHA256SUMS"; fail=1; }
          done
          for arch in amd64 arm64; do
            n="datacore-local-edition-$arch.tar.gz"
            test -f "$out/$n" || { echo "::error::$n was not staged"; fail=1; }
            grep -q "  $n\$" "$out/SHA256SUMS" || { echo "::error::$n is not in SHA256SUMS"; fail=1; }
          done
          test "$fail" = 0 || exit 1

          ( cd "$out" && sha256sum -c SHA256SUMS >/dev/null ) \
            || { echo "::error::the generated manifest does not match the files it describes"; exit 1; }

          # A file in the directory that no manifest line covers would be installed unverified or
          # silently dropped, so the manifest must account for the whole directory, not a subset.
          staged=$(ls "$out" | grep -v '^SHA256SUMS$' | sort)
          listed=$(sed 's/^[0-9a-f]*  //' "$out/SHA256SUMS" | sort)
          test "$staged" = "$listed" \
            || { echo "::error::manifest and directory disagree"; diff <(echo "$staged") <(echo "$listed") || true; exit 1; }
          echo "assembled $(grep -c . "$out/SHA256SUMS") assets, manifest covers exactly the directory"

      - name: A release missing an architecture is refused, not shipped
        run: |
          set -eu
          T=$(mktemp -d)
          pinned=$(sed -n 's/^PINNED_RELEASE="\(.*\)"$/\1/p' install.sh)
          mkdir -p "$T/bundle"
          # arm64 only: exactly the shape of the published draft, where SHA256SUMS named an amd64
          # archive that was never attached.
          echo x > "$T/bundle/datacore-local-edition-arm64.tar.gz"
          set +e
          sh make-release.sh "$pinned" "$T/bundle" > "$T/out" 2>&1
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            cat "$T/out"
            echo "::error::a bundle dir with one architecture was accepted"
            exit 1
          fi
          grep -q "amd64" "$T/out" || { cat "$T/out"; echo "::error::refusal does not name the missing architecture"; exit 1; }
          echo "refused, naming the missing architecture"

      - name: Assembling a version install.sh does not pin is refused
        run: |
          set -eu
          T=$(mktemp -d); mkdir -p "$T/bundle"
          for arch in amd64 arm64; do echo x > "$T/bundle/datacore-local-edition-$arch.tar.gz"; done
          set +e
          sh make-release.sh v0.0.1 "$T/bundle" > "$T/out" 2>&1
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            cat "$T/out"
            echo "::error::assembled a version the installer does not pin — users would download it and get a different install.sh"
            exit 1
          fi
          echo "refused a version install.sh does not pin"

      - name: A helper named in CLI_FILES but absent from the repo is refused
        run: |
          set -eu
          T=$(mktemp -d); mkdir -p "$T/bundle"
          for arch in amd64 arm64; do echo x > "$T/bundle/datacore-local-edition-$arch.tar.gz"; done
          pinned=$(sed -n 's/^PINNED_RELEASE="\(.*\)"$/\1/p' install.sh)
          sed -i 's|^CLI_FILES="\(.*\)"$|CLI_FILES="\1 lib/not-written-yet.sh"|' install.sh
          set +e
          sh make-release.sh "$pinned" "$T/bundle" > "$T/out" 2>&1
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            cat "$T/out"
            echo "::error::staged a release for a helper that does not exist, so the release would ship without it"
            exit 1
          fi
          grep -q "not-written-yet.sh" "$T/out" || { cat "$T/out"; echo "::error::refusal does not name the missing helper"; exit 1; }
          echo "refused, naming the helper that does not exist"

  first-worker:
    name: a new user can set up a worker by following the README
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The README's "Your first worker, start to finish" walkthrough makes claims about what a
      # clean machine prints and which doctor failures are expected before any AI CLI exists. A
      # walkthrough nobody executes drifts into fiction, and this is the page a new user follows,
      # so every step of it runs here -- deliberately with no `claude` on PATH at install time,
      # which is the state the walkthrough actually describes.
      # `datacore worker add claude` died with "No worker matches 'claude'" while `add codex`
      # worked, because the catalogue calls the CLI `claude-code` and codex's binary and catalogue
      # name happen to be the same string. Every surface a user reads says `claude`: the install
      # summary, doctor's launcher check, and the command they typed to install it. The selector
      # now accepts it through a map in the JS half of lib/worker.sh, which is a twin of the `case`
      # in the shell half -- so this asserts the two agree rather than trusting that they do.
      - name: The worker selector accepts the names users are shown
        run: |
          set -eu
          python3 - <<'PY'
          import re, pathlib, sys
          src = pathlib.Path("lib/worker.sh").read_text()

          m = re.search(r'const CLI_BIN = \{([^}]*)\}', src)
          assert m, "CLI_BIN map not found in the JS half of lib/worker.sh"
          js = dict(re.findall(r'"?([A-Za-z0-9_-]+)"?\s*:\s*"([A-Za-z0-9_-]+)"', m.group(1)))

          case = re.search(r'case "\$_cli" in(.*?)esac', src, re.S)
          assert case, "the _bin case statement not found in the shell half"
          sh = {}
          for pats, bin_ in re.findall(r'^\s*([A-Za-z0-9_|-]+)\)\s*_bin=([A-Za-z0-9_-]*)', case.group(1), re.M):
              if not bin_:
                  continue
              sh[pats.split("|")[0]] = bin_

          print("JS  CLI_BIN :", js)
          print("shell _bin  :", sh)
          if js != sh:
              print("::error::the JS CLI_BIN map and the shell _bin case disagree", file=sys.stderr)
              for k in sorted(set(js) | set(sh)):
                  if js.get(k) != sh.get(k):
                      print(f"  {k}: JS={js.get(k)!r} shell={sh.get(k)!r}", file=sys.stderr)
              raise SystemExit(1)

          # The binaries the installer tells the user about must be selectable. If the summary says
          # "no worker CLI installed (claude, codex, agy)", then each of those has to be a name
          # `datacore worker add` accepts, or the installer is naming things the CLI rejects.
          inst = pathlib.Path("install.sh").read_text() + pathlib.Path("lib/worker.sh").read_text()
          shown = re.findall(r'no worker CLI installed \(([^)]*)\)', inst)
          assert shown, "could not find the installer's worker-CLI list"
          for name in [n.strip() for n in shown[0].split(",")]:
              if name not in js.values():
                  print(f"::error::the installer shows '{name}' but the selector does not accept it", file=sys.stderr)
                  raise SystemExit(1)
          print("every CLI the installer names is a selector the CLI accepts:", shown[0])
          PY

      - name: Install with no AI CLI present, as the walkthrough's step 1
        env:
          DATACORE_ACCEPT_EULA: '1'
        run: |
          set -eu
          command -v claude >/dev/null 2>&1 && { echo "::error::a claude CLI exists; this job must start without one"; exit 1; } || true
          cmd=$(grep -m1 '^curl -fsSL .*install.sh | sh$' README.md)
          test -n "$cmd" || { echo "::error::no one-liner in README.md"; exit 1; }
          sh -c "$cmd" > install.log 2>&1 || { cat install.log; exit 1; }
          tail -14 install.log

      - name: The summary says what the walkthrough says it says
        run: |
          set -eu
          grep -q "no worker CLI installed" install.log \
            || { echo "::error::step 1 of the walkthrough shows 'Workers none — no worker CLI installed'; the install did not print that"; grep -i workers install.log || true; exit 1; }
          grep -q "nothing can be dispatched yet" install.log \
            || { echo "::error::the walkthrough shows 'Projects none mapped — nothing can be dispatched yet'"; grep -i projects install.log || true; exit 1; }
          echo "the clean-machine summary matches the walkthrough"

      # The walkthrough names three failures and tells the reader they are expected. If the real
      # set differs -- more, fewer, or different names -- the table in the README is wrong and a
      # new user is either alarmed by an unlisted failure or told to ignore one that matters.
      # The README tells a new user that a clean machine reports no failures and that the launcher
      # checks are *skipped* rather than failed, because a machine without an AI CLI is not a broken
      # machine. That is the claim most likely to scare someone off, so it is the one measured here.
      #
      # An earlier version of this check asserted three FAILs instead, taken from a v0.1.78 install
      # log. 0.1.79 skips them. The assertion was wrong and the README built on it was wrong; the
      # "parsed no FAIL names" guard below is what caught it, so it stays.
      - name: A clean machine reports no failures, and skips the launchers
        run: |
          set -eu
          ~/.datacore/bin/datacore doctor > doctor.log 2>&1 || true
          tail -1 doctor.log

          # Unanchored like the other doctor checks here: the status line carries a leading glyph,
          # and anchoring on it would match nothing and pass. Keep only `group:check` tokens, so
          # prose containing the word is not mistaken for a check name.
          fails=$(grep ' FAIL ' doctor.log | sed -E 's/.* FAIL ([A-Za-z0-9_:.-]+).*/\1/' | grep -E '^[a-z_]+:' | sort -u || true)
          if [ -n "$fails" ]; then
            echo "::error::the README says a clean install has no failures; doctor reported:"
            printf '%s\n' "$fails"
            exit 1
          fi

          # A summary line must exist, or the two checks above passed against an empty file.
          grep -qE 'summary: [0-9]+ ok, 0 fail' doctor.log \
            || { echo "::error::no 'N ok, 0 fail' summary in doctor's output"; cat doctor.log; exit 1; }

          skips=$(grep ' SKIP ' doctor.log | sed -E 's/.* SKIP ([A-Za-z0-9_:.-]+).*/\1/' | grep -E '^[a-z_]+:' | sort -u)
          echo "skipped on a clean machine:"; printf '%s\n' "$skips" | sed 's/^/  /'
          for want in bridge_dispatch:launcher:claude bridge_dispatch:launcher:codex; do
            printf '%s\n' "$skips" | grep -qxF "$want" \
              || { echo "::error::the README says $want is skipped on a clean machine; it was not"; exit 1; }
            grep -qF "$want" README.md \
              || { echo "::error::$want is skipped on a clean install and the README does not mention it"; exit 1; }
          done
          echo "no failures, launchers skipped, and the README says so"

      - name: Install a CLI, then `worker add` turns its launcher check OK — step 4
        run: |
          set -eu
          mkdir -p ~/bin ~/stub
          cat > ~/bin/claude <<'STUB'
          #!/bin/sh
          ENT="$HOME/stub/entry.txt"
          case "$1 $2" in
            "mcp add")    shift 2; printf '%s\n' "$*" > "$ENT"; exit 0 ;;
            "mcp remove") rm -f "$ENT"; exit 0 ;;
            "mcp get")    [ -f "$ENT" ] || exit 1
                          cat "$ENT"
                          echo "To remove this server, run: claude mcp remove datacore -s user"
                          exit 0 ;;
          esac
          exit 1
          STUB
          chmod +x ~/bin/claude
          export PATH="$HOME/bin:$PATH"

          # The walkthrough promises this one command is enough: no reinstall, no `worker sync`.
          #
          # install.sh comes from main but lib/*.sh come from the release, so this job can run new
          # installer logic against an old helper -- the same situation the worker-trim step in the
          # published job reports rather than fails on, because the fix is cutting a release, not
          # reverting. A release whose lib/worker.sh predates the CLI-name selector rejects
          # `claude`; the step still has to exercise steps 4 and 5, so it says so and falls back to
          # the family name. The static drift check at the top of this job is what guards the fix
          # itself, and it runs against the checkout.
          if ! ~/.datacore/bin/datacore worker add claude; then
            if grep -q 'CLI_BIN' lib/worker.sh; then
              echo "::warning::the published lib/worker.sh predates the CLI-name selector, so 'worker add claude' is rejected on the released helper — cut a release carrying the current lib/worker.sh"
              ~/.datacore/bin/datacore worker add claude-worker
            else
              echo "::error::'datacore worker add claude' failed and the checkout has no CLI_BIN map either, so the README's step 4 is simply wrong"
              exit 1
            fi
          fi
          ~/.datacore/bin/datacore worker list

          n=$(python3 -c "
          import json, os
          reg = json.load(open(os.path.expanduser('~/.datacore/current/generated/azure-worker-registry.json')))['workers']
          print(sum(1 for w in reg if w.get('phases')))")
          echo "dispatchable workers: $n"
          test "$n" -ge 1 || { echo "::error::worker add enabled nothing, so the walkthrough's step 4 is wrong"; exit 1; }

          ~/.datacore/bin/datacore doctor > doctor2.log 2>&1 || true
          tail -1 doctor2.log

          # The README's step 4 promises this exact transition, so assert the transition and not
          # merely the absence of failures -- a doctor that stopped running the check at all would
          # also produce "no failures".
          grep -qE ' OK +bridge_dispatch:launcher:claude' doctor2.log \
            || { echo "::error::step 4 says the claude launcher check becomes OK after worker add; it did not"; grep launcher doctor2.log || true; exit 1; }

          fails=$(grep ' FAIL ' doctor2.log | sed -E 's/.* FAIL ([A-Za-z0-9_:.-]+).*/\1/' | grep -E '^[a-z_]+:' | sort -u || true)
          if [ -n "$fails" ]; then
            echo "::error::enabling a worker introduced a failure:"; printf '%s\n' "$fails"; exit 1
          fi
          echo "the claude launcher check is OK and nothing started failing"

      - name: Mapping a project works before any task exists — the walkthrough's step 5
        run: |
          set -eu
          mkdir -p ~/repo && git -C ~/repo init -q && git -C ~/repo commit -q --allow-empty -m init
          ~/.datacore/bin/datacore project link my-project ~/repo
          ~/.datacore/bin/datacore project list | tee project.log
          grep -q "my-project" project.log \
            || { echo "::error::the walkthrough maps a project before any task exists and that failed"; exit 1; }
          echo "a project maps with no prior task, as the README states"
